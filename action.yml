name: Terraform plan gate
description: Fail a pull request on dangerous Terraform changes, and explain them in a comment.
author: DevOps Daily
branding:
  icon: shield
  color: purple

inputs:
  plan:
    description: >-
      Path to JSON from `terraform show -json <planfile>`. Relative paths are
      resolved against the workspace, not the action checkout.
    required: true
  fail-on:
    description: Lowest severity that fails the job (block, warn or note).
    required: false
    default: block
  comment:
    description: Post the findings as a pull request comment.
    required: false
    default: "true"
  explain:
    description: Ask DigitalOcean inference to write the explanation. Needs do-inference-key.
    required: false
    default: "true"
  do-inference-key:
    description: DigitalOcean inference API key. Without it the comment uses the rule text only.
    required: false
    default: ""
  github-token:
    description: Token used to post the comment.
    required: false
    default: ${{ github.token }}

outputs:
  passed:
    description: "true when the plan passes the gate"
    value: ${{ steps.gate.outputs.passed }}
  blocking:
    description: Number of blocking findings.
    value: ${{ steps.gate.outputs.blocking }}
  warnings:
    description: Number of warnings.
    value: ${{ steps.gate.outputs.warnings }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run the gate
      id: gate
      shell: bash
      env:
        # Inputs reach the shell as data. Interpolating them into the script
        # would run whatever a branch put in a filename.
        DO_INFERENCE_KEY: ${{ inputs.explain == 'true' && inputs.do-inference-key || '' }}
        PLAN_INPUT: ${{ inputs.plan }}
        FAIL_ON: ${{ inputs.fail-on }}
        EXPLAIN: ${{ inputs.explain }}
      run: |
        set -euo pipefail
        case "$PLAN_INPUT" in
          /*) PLAN="$PLAN_INPUT" ;;
          *)  PLAN="$GITHUB_WORKSPACE/$PLAN_INPUT" ;;
        esac
        args=("$PLAN" --fail-on "$FAIL_ON" --comment "$RUNNER_TEMP/plan-gate.md" --json "$RUNNER_TEMP/plan-gate.json")
        [ "$EXPLAIN" = "true" ] || args+=(--no-explain)
        python -m plan_gate "${args[@]}" || echo "gate_failed=1" >> "$GITHUB_ENV"
      working-directory: ${{ github.action_path }}

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/plan-gate.md"

    - name: Fail the job when the plan does not pass
      if: env.gate_failed == '1'
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        echo "::error title=Terraform plan gate::the plan has findings at or above $FAIL_ON"
        exit 1
